[package]
name = "cce-vault"
version = "0.1.0"
edition = "2021"
description = "The notes vault shared by cce apps: Markdown parsing with wikilinks, link index, watcher, search and writes"

[lib]
name = "cce_vault"
path = "src/lib.rs"

[[bin]]
name = "cce-vault"
path = "src/main.rs"


[dependencies]
# The socket convention and spawn_detached / de_bin, for the cce-notes
# protocol (`notes_ipc`); GUI-free, without the config. `markdown`: the
# reading view, frontmatter properties and the leaf rules the index shares.
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "f854e8f4b4fc2c9b32f9d37a75f028a41550667b", default-features = false, features = ["markdown"] }
chrono = { version = "0.4.45", features = ["serde"] }
# Only for its `serde` feature: `parse::Properties` (cce_core::markdown) is an
# IndexMap, and `Note` serializes it.
indexmap = { version = "2", features = ["serde"] }
kdl = "4.6"
log = "0.4"
notify = "8.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
